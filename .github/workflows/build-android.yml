# Build the Google Play file (.aab) + a test APK on GitHub — no Expo/EAS build credits needed.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64   the upload keystore (.jks) as base64 text
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# (Get them for free with:  eas credentials -p android  → production → Keystore → Download existing keystore)
#
# Run: Actions → "Build Android (.aab)" → Run workflow → type a version code bigger than the last one on Play.
name: Build Android (.aab)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code — must be BIGGER than the last one uploaded to Google Play (Play Console → App bundle explorer)'
        required: true
        type: number

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 — see the setup notes at the top of this file."
            exit 1
          fi

      - name: Set version code
        run: |
          node -e "
            const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));
            a.expo.android.versionCode=Number('${{ inputs.version_code }}');
            fs.writeFileSync('app.json',JSON.stringify(a,null,2));
            console.log('version',a.expo.version,'code',a.expo.android.versionCode);"
          echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> $GITHUB_ENV

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Add release signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | tr -d '\r\n ' | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<'GRADLE'

          // ---- added by CI: sign release builds with the Play upload key ----
          android {
              signingConfigs {
                  upload {
                      storeFile file("upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          GRADLE
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Build .aab and .apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # phones only (no emulator x86 code) → faster build, smaller files
        run: ./gradlew bundleRelease assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Collect files
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/pdf-toolkit-v${APP_VERSION}-${{ inputs.version_code }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/pdf-toolkit-v${APP_VERSION}-${{ inputs.version_code }}.apk"
          ls -la out
          echo "Signing certificate (must match the upload key in Play Console):"
          keytool -printcert -jarfile out/*.apk | grep -E "SHA1|SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-v${{ env.APP_VERSION }}-${{ inputs.version_code }}
          path: out/*
