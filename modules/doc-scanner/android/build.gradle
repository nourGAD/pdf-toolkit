plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.docscanner'
version = '1.0.0'

android {
  namespace "expo.modules.docscanner"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google ML Kit Document Scanner — free, on-device, CamScanner-style UI
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
}
